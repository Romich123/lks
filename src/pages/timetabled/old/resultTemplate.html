<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рабочий график</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 2em;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        .main {
            width: 100%;
            height: 100%;
        }

        .main-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        .time-display {
            font-size: 1.3em;
            gap: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .contact-info {
            text-align: center;
        }

        header {
            display: flex;
            justify-content: space-between;
        }

        #worker-name {
            font-size: 1.7em;
            margin-bottom: 20px;
            font-weight: bold;
        }

        #phone {
            font-size: 1.7em;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
        }

        .current-time {
            padding-top: 30px;
            font-size: 1.6em;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <span class="current-week-day"></span>
        </div>
        <div>
            Техническая поддержка ФБ 6-707
        </div>
    </header>
    <div id="working-time" class="main">
        <div class="main-wrapper">
            <div class="contact-info">
                <span>
                    Сейчас работает:
                </span>
                <span id="worker-name"></span>
                <span id="phone"></span>
            </div>
            <div class="time-display">
                <div>
                    Неделя: <span class="current-week"></span>
                </div>
                <div>
                    <div class="current-time"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="non-working-time" class="main">
        <div class="main-wrapper">
            <div>
                Сейчас нерабочее время
            </div>
            <div class="time-display">
                <div>
                    Неделя: <span class="current-week"></span>
                </div>
                <div>
                    <div class="current-time"></div>
                </div>
            </div>
        </div> 
    </div>

    <script>
        let schedule = {"schedule":[[{"startHour":16,"startMinute":0,"endHour":19,"endMinute":30,"who":"Дракин Роман Максимович","contact":"+7 (950) 147-70-13"}],[{"startHour":16,"startMinute":0,"endHour":19,"endMinute":30,"who":"Дракин Роман Максимович","contact":"+7 (950) 147-70-13"}],[{"startHour":16,"startMinute":0,"endHour":19,"endMinute":30,"who":"Дракин Роман Максимович","contact":"+7 (950) 147-70-13"}],[{"startHour":16,"startMinute":0,"endHour":19,"endMinute":30,"who":"Дракин Роман Максимович","contact":"+7 (950) 147-70-13"}],[{"startHour":16,"startMinute":0,"endHour":19,"endMinute":30,"who":"Дракин Роман Максимович","contact":"+7 (950) 147-70-13"}],[{"startHour":16,"startMinute":0,"endHour":19,"endMinute":30,"who":"Дракин Роман Максимович","contact":"+7 (950) 147-70-13"}],[{"startHour":16,"startMinute":0,"endHour":19,"endMinute":30,"who":"Дракин Роман Максимович","contact":"+7 (950) 147-70-13"}],[{"startHour":16,"startMinute":0,"endHour":19,"endMinute":30,"who":"Дракин Роман Максимович","contact":"+7 (950) 147-70-13"}],[{"startHour":16,"startMinute":0,"endHour":19,"endMinute":30,"who":"Дракин Роман Максимович","contact":"+7 (950) 147-70-13"}],[{"startHour":16,"startMinute":0,"endHour":19,"endMinute":30,"who":"Дракин Роман Максимович","contact":"+7 (950) 147-70-13"}],[{"startHour":16,"startMinute":0,"endHour":19,"endMinute":30,"who":"Дракин Роман Максимович","contact":"+7 (950) 147-70-13"}],[{"startHour":16,"startMinute":0,"endHour":19,"endMinute":30,"who":"Дракин Роман Максимович","contact":"+7 (950) 147-70-13"}],[{"startHour":16,"startMinute":0,"endHour":19,"endMinute":30,"who":"Дракин Роман Максимович","contact":"+7 (950) 147-70-13"}],[{"startHour":16,"startMinute":0,"endHour":19,"endMinute":30,"who":"Дракин Роман Максимович","contact":"+7 (950) 147-70-13"}]],"startWeek":0}
        // @schedule-insert
        function getISOWeekNumber(d) {
            d = new Date(d.valueOf());
            let dayNr = (d.getDay() + 6) % 7;
            d.setDate(d.getDate() - dayNr + 3);
            const jan4 = new Date(d.getFullYear(), 0, 4);
            const dayDiff = (d - jan4) / 86400000;
            return 1 + Math.ceil(dayDiff / 7);
        }
        
        const weekDays = [
            "Воскресенье",
            "Понедельник",
            "Вторник",
            "Среда",
            "Четверг",
            "Пятница",
            "Суббота",
        ]

        function getCurrentWeekDay() {
            return weekDays[new Date().getDay()]
        }

        function getCurrentWeek() {
            return getISOWeekNumber(new Date()) - schedule.startWeek
        }

        function getCurrentDayIndex() {
            const date = new Date()
            const week = getCurrentWeek(date)
            const isOdd = Boolean(week % 2)

            const dayOfWeek = (date.getDay() + 6) % 7

            return isOdd ? dayOfWeek : (dayOfWeek + 7)
        }

        function getCurrentTime() {
            const date = new Date()
            return [date.getHours(), date.getMinutes()]
        }

        function getCurrentAssignment() {
            const dayIndex = getCurrentDayIndex()

            const date = new Date()
            const dayAssignments = schedule.schedule[dayIndex]

            const [currentHour, currentMinute] = getCurrentTime()
            const timeOfDay = currentHour * 60 + currentMinute

            for (const ass of dayAssignments) {
                const assStartTime = ass.startHour * 60 + ass.startMinute 
                const assEndTime = ass.endHour * 60 + ass.endMinute
                console.log(ass, assStartTime, assEndTime, timeOfDay)

                if (assStartTime <= timeOfDay && timeOfDay <= assEndTime) {
                    return ass
                }
            }
        }

        const workerInsert = document.querySelector("#worker-name")
        const contactInsert = document.querySelector("#phone")

        const weekInsert = document.querySelectorAll(".current-week")
        const timeInsert = document.querySelectorAll(".current-time")
        const weekDayInsert = document.querySelectorAll(".current-week-day")

        const workingBlock = document.querySelector("#working-time")
        const nonworkingBlock = document.querySelector("#non-working-time")
        function updateInfo() {
            setTimeout(() => {
                updateInfo()
            }, 1000)

            const [hour, minute] = getCurrentTime()

            const timeStr = `${(hour + "").padStart(2, "0")}:${(minute + "").padStart(2, "0")}`

            timeInsert.forEach((t) => {
                t.innerHTML = timeStr
            })

            const currentWeek = getCurrentWeek()
            weekInsert.forEach((w) => {
                w.innerHTML = `${currentWeek} (${(currentWeek % 2) ? "Нечетная" : "Четная"})`
            })
            weekDayInsert.forEach((w) => {
                w.innerHTML = getCurrentWeekDay()
            })
            
            const assignment = getCurrentAssignment()

            if (!assignment) {
                workingBlock.style.display = "none"
                nonworkingBlock.style.display = "block"
                return
            }

            workingBlock.style.display = "block"
            nonworkingBlock.style.display = "none"

            workerInsert.innerHTML = assignment?.who ?? "Нерабочее время"
            contactInsert.innerHTML = assignment?.contact ?? ""


        }

        updateInfo()
        window.requestAnimationFrame(updateInfo)
    </script>
</div>
</html>
